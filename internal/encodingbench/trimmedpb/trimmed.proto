syntax = "proto3";

package trimmedpb;

option go_package = "github.com/agent-substrate/substrate/internal/encodingbench/trimmedpb";

// TrimmedActor is a real-protobuf realization of the "field trims" idea, used to
// measure the true schema-level record size (with protobuf field tags) rather
// than the positional hand-rolled estimate. Field numbers mirror ateapipb.Actor
// so tag widths match a real migration. The trims versus Actor are:
//   - actor_id and ateom_pod_uid are bytes (16 B) instead of 36-char UUID strings
//   - the snapshot is a flat template-relative suffix string instead of the
//     nested SnapshotInfo/ExternalSnapshotInfo message carrying the full URI
message TrimmedActor {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_RESUMING = 1;
    STATUS_RUNNING = 2;
    STATUS_SUSPENDING = 3;
    STATUS_SUSPENDED = 4;
    STATUS_PAUSING = 5;
    STATUS_PAUSED = 6;
  }

  bytes actor_id = 1;
  int64 version = 2;
  string actor_template_namespace = 3;
  string actor_template_name = 4;
  Status status = 5;
  string ateom_pod_namespace = 6;
  string ateom_pod_name = 7;
  string ateom_pod_ip = 8;
  bytes ateom_pod_uid = 11;
  // snapshot_suffix is the template-relative tail of the external snapshot URI;
  // the full URI is reconstructed from the bucket convention + template + id.
  string snapshot_suffix = 12;
  map<string, string> worker_selector = 13;
  string worker_pool_name = 14;
  // snapshot_uri_full is the fallback for URIs that do not match the convention.
  string snapshot_uri_full = 15;
}
